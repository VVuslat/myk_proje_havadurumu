<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basit Hava Durumu Uygulaması</title>
    <!-- style.css dosyasını bağlama -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="weather-card">
            <div class="weather-header">
                <img src="https://cdn-icons-png.flaticon.com/512/1116/1116453.png" alt="Bulut" class="weather-icon">
                <h1>Hava Durumu</h1>
            </div>
            <div class="weather-form">
                <input type="text" id="sehirInput" placeholder="Şehir adı giriniz">
                <button id="getirBtn">Getir</button>
            </div>
            <div id="sonuc" class="weather-result"></div>
        </div>
        <footer>
            <span>© 2025 MYK Proje | Tasarım: VVuslat</span>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
